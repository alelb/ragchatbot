[project]
name = "starting-codebase"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb==1.0.15",
    "anthropic==0.58.2",
    "sentence-transformers==5.0.0",
    "fastapi==0.116.1",
    "uvicorn==0.35.0",
    "python-multipart==0.0.20",
    "python-dotenv==1.1.1",
]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-m 'not live'"
markers = [
    "live: calls the real LLM configured in .env (run with -m live)",
]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
# pycodestyle errors, pyflakes, import sorting, bugbear
select = ["E", "F", "I", "B"]
# Line length is left to black; zip() over parallel ChromaDB lists needs no strict=
ignore = ["E501", "B905"]

[tool.ruff.lint.isort]
known-first-party = ["ai_generator", "app", "config", "document_processor", "models", "rag_system", "search_tools", "session_manager", "vector_store"]
